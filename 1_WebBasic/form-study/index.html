<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <body>
    <h1>회원가입</h1>
    <form>
      <label for="id">아이디</label>
      <input type="text" name="id" id="id" />
      <br />
      <label for="pw">비밀번호</label>
      <input type="password" name="pw" id="pw" />
      <br />
      <label for="pwc">비밀번호 확인</label>
      <input type="password" name="pwc" id="pwc" />
      <br />
      <label for="email"> 이메일 </label>
      <input type="email" name="email" id="email" />
      <br />
      <p>성별</p>
      <label> <input type="radio" name="gender" id="male" />남성 </label>
      <label> <input type="radio" name="gender" id="female" />여성 </label>
      <br />
      <p>좋아하는 음식</p>
      <label> <input type="checkbox" name="food" id="pasta" />파스타 </label>
      <label> <input type="checkbox" name="food" id="chicken" />치킨 </label>
      <br />
      <button type="submit">가입하기</button>
    </form>
  </body>
</html>
