<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리반 시간표</title>
  </head>
  <body>
    <h1>우리반 시간표</h1> 
    <table border="1">
      <!-- 헤더 -->
      <thead>
        <tr>
          <th>시간</th>
          <th>월</th>
          <th>화</th>
          <th>수</th>
          <th>목</th>
          <th>금</th>
        </tr>
      </thead>
      <!-- 시간표 내용 -->
      <tbody>
        <tr>
          <td>09:00</td>
          <td rowspan="4">HTML</td>
          <td rowspan="4">CSS</td>
          <td rowspan="4">Git</td>
          <td rowspan="4">JavaScript</td>
          <td rowspan="4">React</td>
        </tr>
        <tr>
          <td>10:00</td>
        </tr>
        <tr>
          <td>11:00</td>
        </tr>
        <tr>
          <td>12:00</td>
        </tr>
        <tr>
          <td>13:00</td>
          <td colspan="5">점심 시간</td>
        </tr>
        <tr>
          <td>14:00</td>
          <td rowspan="4">HTML</td>
          <td rowspan="4">CSS</td>
          <td rowspan="4">Git</td>
          <td rowspan="4">JavaScript</td>
          <td rowspan="4">React</td>
        </tr>
        <tr>
          <td>15:00</td>
        </tr>
        <tr>
          <td>16:00</td>
        </tr>
        <tr>
          <td>17:00</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
