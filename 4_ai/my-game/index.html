<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>피카츄 배구</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="mainMenu">
      <h1>피카츄 배구</h1>
      <button id="onePlayerModeButton">1인 모드</button>
      <button id="twoPlayerModeButton">2인 모드</button>
    </div>

    <div id="twoPlayerLobby" class="hidden">
      <h1 id="gameTitle">피카츄 배구</h1>
      <input type="text" id="roomInput" placeholder="방 번호" />
      <button id="createRoomButton">방 만들기</button>
      <button id="joinRoomButton">참가</button>
      <p id="roomStatus"></p>
    </div>

    <h1 id="gameStatus" class="hidden"></h1>
    <canvas id="gameCanvas" width="800" height="400" class="hidden"></canvas>
    <script src="game.js"></script>
  </body>
</html>
