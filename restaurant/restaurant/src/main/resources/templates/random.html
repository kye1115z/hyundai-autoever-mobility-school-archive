<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>랜덤 추천</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1>🎲오늘의 추천 음식점</h1>

    <div class="restaurant-card">
        <h2 th:text="${restaurant.name}">음식점 이름</h2>
        <p><strong>카테고리:</strong><span th:text="${restaurant.category}">한식</span></p>
        <p><strong>위치:</strong><span th:text="${restaurant.location}">강남역</span></p>
        <p><strong>대표메뉴:</strong><span th:text="${restaurant.signature}">참치김밥</span></p>
        <p><strong>설명:</strong><span th:text="${restaurant.description}">마싯다.</span></p>
    </div>

<a href="/restaurants/random" class="btn btn-random">🎲 다시 추천 받기</a>
    <br><br>
<a href="/restaurants" class="btn btn-add">📋 전체 목록 보기</a>
</body>
</html>
