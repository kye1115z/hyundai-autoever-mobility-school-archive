<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/css/style.css">
    <title>음식점 목록</title>
</head>
<body>
    <h1>🍽️음식점 추천</h1>
    <a href="/restaurants/random" class="btn btn-random">
        🎲 오늘 뭐 먹지?
    </a>
    <a href="/restaurants/new" class="btn btn-add">
        ➕ 새 음식점 추가
    </a>

    <h2>전체 음식점 목록</h2>

    <table border="1">
        <thead>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>카테고리</th>
            <th>위치</th>
            <th>대표메뉴</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="restaurant: ${restaurants}">
            <td th:text="${restaurant.id}">1</td>
            <td th:text="${restaurant.name}">김밥천국</td>
            <td th:text="${restaurant.category}">한식</td>
            <td th:text="${restaurant.location}">강남역</td>
            <td th:text="${restaurant.signature}">참치김밥</td>
        </tr>
        </tbody>
    </table>


</body>
</html>
