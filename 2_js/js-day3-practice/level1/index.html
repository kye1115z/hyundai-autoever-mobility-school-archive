<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 1</title>
    <style>
      .highlight {
        background-color: yellow;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <!-- problem 1 -->
    <h1 id="title">원래 제목</h1>
    <button id="changeBtn">제목 변경</button>

    <!-- problem 2 -->
    <p id="text">이 텍스트의 스타일을 바꿔 보세요</p>
    <button id="styleBtn">스타일 변경</button>

    <!-- problem 3 -->
    <p id="para">이 문단을 강조해 보세요.</p>
    <button id="toggleBtn">강조 토글</button>

    <!-- problem 4 -->
    <ul id="list">
      <li>항목 1</li>
    </ul>
    <button id="addBtn">항목 추가</button>

    <!-- problem 5 -->
    <input type="text" id="nameInput" placeholder="이름 입력" />
    <button id="greetBtn">인사하기</button>
    <p id="greeting"></p>

    <!-- problem 6 -->
    <img id="photo" src="image1.jpg" alt="사진" />
    <button id="changePhotoBtn">사진 변경</button>

    <!-- problem 7 -->
    <div id="box" style="width: 100px; height: 100px; background: blue"></div>
    <button id="hideBtn">숨기기</button>
    <button id="showBtn">보이기</button>

    <!-- problem 8 -->
    <div id="content"></div>
    <button id="addContentBtn">콘텐츠 추가</button>

    <!-- problem 9 -->
    <ul id="itemList">
      <li id="item1">항목 1</li>
      <li id="item2">항목 2</li>
      <li id="item3">항목 3</li>
    </ul>
    <button id="removeBtn">첫 번째 항목 제거</button>

    <!-- problem 10 -->
    <a id="link" href="https://naver.com"> 네이버</a>
    <button id="changeLinkBtn">링크 변경</button>
