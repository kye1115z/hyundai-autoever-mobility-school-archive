<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 2</title>
  </head>
  <body>
    <!-- problem 1 -->
    <div id="hoverBox" style="width: 200px; height: 200px; background: gray">
      마우스를 올려보세요
    </div>

    <!-- problem 2 -->
    <p id="text">더블클릭 해보세요</p>

    <!-- problem 3 -->
    <input type="text" id="searchInput" placeholder="검색어 입력" />
    <p id="searchText"></p>

    <!-- problem 4 -->
    <form id="myForm">
      <input type="text" id="username" placeholder="사용자 이름" />
      <button type="submit">제출</button>
    </form>
    <p id="result"></p>

    <!-- problem 5 -->
    <button id="countBtn">클릭하세요</button>
    <p id="count">클릭 횟수: 0</p>

    <!-- problem 6 -->
    <input type="text" id="messageInput" placeholder="메시지 입력(Enter)" />
    <p id="message"></p>

    <!-- problem 7 -->
    <input type="checkbox" id="agreeCheck" />
    <label for="agreeCheck">동의합니다</label>
    <button id="submitButton">제출</button>
    <p id="checkResult"></p>

    <!-- problem 8 -->
    <ul id="colorList">
      <li data-color="red">빨강</li>
      <li data-color="blue">파랑</li>
      <li data-color="green">초록</li>
    </ul>
    <div
      id="colorBox"
      style="width: 100px; height: 100px; border: 1px solid black"
    ></div>

    <!-- problem 9 -->
    <input type="text" id="focusInput" placeholder="포커스를 주세요" />
    <p id="focusMessage"></p>

    <!-- problem 10 -->
    <button class="colorBtn" data-color="red">빨강</button>
    <button class="colorBtn" data-color="blue">파랑</button>
    <button class="colorBtn" data-color="green">초록</button>
    <p id="selectedColor"></p>

    <script src="problem01.js"></script>
    <script src="problem02.js"></script>
    <script src="problem03.js"></script>
    <script src="problem04.js"></script>
    <script src="problem05.js"></script>
    <script src="problem06.js"></script>
    <script src="problem07.js"></script>
    <script src="problem08.js"></script>
    <script src="problem09.js"></script>
    <script src="problem10.js"></script>
  </body>
</html>
