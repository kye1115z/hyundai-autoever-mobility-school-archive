<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3</title>
  </head>
  <body>
    <!-- problem 1 -->
    <input type="text" id="testInput" placeholder="값 입력" />
    <button id="checkBtn">확인</button>
    <p id="result"></p>

    <!-- problem 2 -->
    <input type="text" id="usernameInput" placeholder="이름 입력" />
    <button id="greetBtn">인사하기</button>
    <p id="greeting"></p>

    <!-- problem 3 -->
    <input type="text" id="titleInput" placeholder="제목 입력" />
    <input type="text" id="authorInput" placeholder="작성자 입력" />
    <button id="createBtn">게시물 생성</button>
    <div id="post"></div>

    <!-- problem 4 -->
    <button id="showEmailBtn">이메일 보기</button>
    <p id="emailDisplay"></p>

    <!-- problem 5 -->
    <button id="addItemBtn">항목 추가</button>
    <button id="checkButton">항목 확인</button>
    <ul id="itemList"></ul>
    <p id="status"></p>

    <!-- problem 6 -->
    <input
      type="number"
      id="priceInput"
      placeholder="가격 입력 (0 입력  가능)"
    />
    <button id="setPriceBtn">가격 설정</button>
    <p id="priceDisplay"></p>

    <!-- problem 7 -->
    <input type="number" id="countInput" placeholder="개수 입력" />
    <button id="testOrBtn">|| 연산자</button>
    <button id="testNullishBtn">?? 연산자</button>
    <p id="orResult"></p>
    <p id="nullishResult"></p>

    <!-- problem 8 -->
    <button id="showCityBtn">도시 보기</button>
    <p id="cityDisplay"></p>

    <!-- problem 9 -->
    <button id="callMethodBtn">메서드 호출</button>
    <p id="methodResult"></p>

    <!-- problem 10 -->
    <input type="text" id="nameInput" placeholder="이름" />
    <input type="text" id="cityInput" placeholder="도시" />
    <input type="number" id="ageInput" placeholder="나이" />
    <button id="createProfileBtn">프로필 생성</button>
    <div id="profile"></div>

    <script src="problem01.js"></script>
    <script src="problem02.js"></script>
    <script src="problem03.js"></script>
    <script src="problem04.js"></script>
    <script src="problem05.js"></script>
    <script src="problem06.js"></script>
    <script src="problem07.js"></script>
    <script src="problem08.js"></script>
    <script src="problem09.js"></script>
    <script src="problem10.js"></script>
  </body>
</html>
