<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Shooting Game with Boss</title>
    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: Arial, sans-serif;
      }

      #container {
        position: relative;
      }

      #ui {
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        font-size: 16px;
      }

      #game {
        position: relative;
        width: 800px;
        height: 600px;
        background: linear-gradient(#0a0a2a, #000);
        overflow: hidden;
        border: 2px solid #444;
      }

      #player {
        position: absolute;
        width: 40px;
        height: 40px;
        background: skyblue;
        clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);
      }

      .missile {
        position: absolute;
        width: 4px;
        height: 12px;
        background: yellow;
      }

      .enemy {
        position: absolute;
        width: 36px;
        height: 36px;
        background: crimson;
        clip-path: polygon(50% 100%, 100% 0%, 50% 20%, 0% 0%);
      }

      .boss {
        position: absolute;
        width: 120px;
        height: 80px;
        background: purple;
        border: 3px solid white;
      }

      .boss-hp {
        position: absolute;
        top: -10px;
        left: 0;
        width: 100%;
        height: 6px;
        background: #333;
      }

      .boss-hp-inner {
        height: 100%;
        background: red;
      }

      .powerup {
        position: absolute;
        width: 24px;
        height: 24px;
        border: 2px solid gold;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffeb3b, #fbc02d);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .powerup-active {
        position: fixed;
        top: 50px;
        right: 20px;
        padding: 8px 16px;
        background: rgba(255, 235, 59, 0.9);
        border-radius: 4px;
        color: #000;
        font-weight: bold;
        animation: fadeInOut 0.5s ease-out;
      }

      @keyframes fadeInOut {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        50% {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 1;
        }
      }

      .explosion {
        position: absolute;
        width: 40px;
        height: 40px;
        background: radial-gradient(circle, #ff9800, #ff5722);
        border-radius: 50%;
        animation: explode 0.6s ease-out forwards;
        pointer-events: none;
      }

      @keyframes explode {
        0% {
          opacity: 1;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="ui">
        <div>HP: <span id="hp">3</span></div>
        <div>Kills: <span id="kills">0</span></div>
        <div>Wave: <span id="wave">1</span></div>
      </div>
      <div id="game">
        <div id="player"></div>
      </div>
    </div>

    <script>
      const game = document.getElementById("game");
      const player = document.getElementById("player");
      const hpEl = document.getElementById("hp");
      const killsEl = document.getElementById("kills");

      const GAME_WIDTH = 800;
      const GAME_HEIGHT = 600;

      let x = GAME_WIDTH / 2 - 20;
      let y = GAME_HEIGHT - 60;

      let hp = 3;
      let kills = 0;
      let wave = 1;
      let totalKills = 0;

      const speed = 6;
      let missileSpeed = 10;
      let enemySpeed = 2;
      let spawnRate = 1000;

      const missiles = [];
      const enemies = [];
      const powerups = [];
      const particles = [];

      let activePowerup = null;
      let powerupTimer = 0;
      let multiShot = false;

      let boss = null;
      let bossDir = 1;
      let spawnEnemyInterval = null;

      const keys = {};

      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;
        if (e.key === " ") fireMissile();
      });

      document.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      function fireMissile() {
        const mx = x + 18;
        const my = y;

        if (multiShot) {
          for (let angle of [-0.3, 0, 0.3]) {
            createMissile(mx + 10 * angle, my, angle);
          }
        } else {
          createMissile(mx, my, 0);
        }
      }

      function createMissile(mx, my, angle) {
        const missile = document.createElement("div");
        missile.className = "missile";
        missile.style.left = mx + "px";
        missile.style.top = my + "px";
        game.appendChild(missile);
        missiles.push({ el: missile, x: mx, y: my, angle });
      }

      function spawnEnemy() {
        if (boss) return;

        const enemy = document.createElement("div");
        enemy.className = "enemy";

        const ex = Math.random() * (GAME_WIDTH - 36);
        const ey = -40;

        enemy.style.left = ex + "px";
        enemy.style.top = ey + "px";

        game.appendChild(enemy);
        enemies.push({ el: enemy, x: ex, y: ey });
      }

      function startEnemySpawner() {
        if (spawnEnemyInterval) clearInterval(spawnEnemyInterval);
        spawnEnemyInterval = setInterval(spawnEnemy, spawnRate);
      }

      function spawnPowerup(ex, ey) {
        const types = ["speed", "multishot", "heal"];
        const type = types[Math.floor(Math.random() * types.length)];
        const symbols = { speed: "⚡", multishot: "🔶", heal: "❤️" };

        const powerup = document.createElement("div");
        powerup.className = "powerup";
        powerup.textContent = symbols[type];
        powerup.style.left = ex + "px";
        powerup.style.top = ey + "px";

        game.appendChild(powerup);
        powerups.push({ el: powerup, x: ex, y: ey, type });
      }

      function createExplosion(x, y) {
        const explosion = document.createElement("div");
        explosion.className = "explosion";
        explosion.style.left = x + "px";
        explosion.style.top = y + "px";
        game.appendChild(explosion);

        setTimeout(() => explosion.remove(), 600);

        for (let i = 0; i < 8; i++) {
          const angle = (Math.PI * 2 * i) / 8;
          const vx = Math.cos(angle) * 4;
          const vy = Math.sin(angle) * 4;

          const particle = document.createElement("div");
          particle.style.left = x + "px";
          particle.style.top = y + "px";
          particle.style.width = "4px";
          particle.style.height = "4px";
          particle.style.background = "#ff9800";
          particle.style.borderRadius = "50%";
          game.appendChild(particle);

          particles.push({ el: particle, x, y, vx, vy, life: 30 });
        }
      }

      function activatePowerup(type) {
        const messages = {
          speed: "⚡ 연사 속도 UP!",
          multishot: "🔶 멀티샷 활성화!",
          heal: "❤️ HP 회복!",
        };

        if (type === "speed") {
          missileSpeed = 15;
          activePowerup = "speed";
          powerupTimer = 300;
        } else if (type === "multishot") {
          multiShot = true;
          activePowerup = "multishot";
          powerupTimer = 300;
        } else if (type === "heal" && hp < 3) {
          hp++;
          hpEl.textContent = hp;
        }

        const msg = document.createElement("div");
        msg.className = "powerup-active";
        msg.textContent = messages[type];
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 1500);
      }

      startEnemySpawner();

      function spawnBoss() {
        const bossEl = document.createElement("div");
        bossEl.className = "boss";

        const hpBar = document.createElement("div");
        hpBar.className = "boss-hp";
        const hpInner = document.createElement("div");
        hpInner.className = "boss-hp-inner";
        hpBar.appendChild(hpInner);

        bossEl.appendChild(hpBar);
        game.appendChild(bossEl);

        const bossHp = 15 + wave * 5;
        boss = {
          el: bossEl,
          hpInner,
          x: GAME_WIDTH / 2 - 60,
          y: 40,
          hp: bossHp,
          maxHp: bossHp,
        };
      }

      function nextWave() {
        if (boss) {
          boss.el.remove();
          boss = null;
        }

        wave++;
        kills = 0;
        killsEl.textContent = kills;
        document.getElementById("wave").textContent = wave;

        enemySpeed = 2 + wave * 0.3;
        spawnRate = Math.max(500, 1000 - wave * 50);

        startEnemySpawner();

        const msg = document.createElement("div");
        msg.className = "powerup-active";
        msg.textContent = `🎯 WAVE ${wave} 시작!`;
        msg.style.background = "rgba(100, 200, 255, 0.9)";
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
      }

      function isColliding(a, b, aw, ah, bw, bh) {
        return (
          a.x < b.x + bw && a.x + aw > b.x && a.y < b.y + bh && a.y + ah > b.y
        );
      }

      function gameLoop() {
        // 플레이어 이동
        if (keys.ArrowUp) y -= speed;
        if (keys.ArrowDown) y += speed;
        if (keys.ArrowLeft) x -= speed;
        if (keys.ArrowRight) x += speed;

        x = Math.max(0, Math.min(GAME_WIDTH - 40, x));
        y = Math.max(0, Math.min(GAME_HEIGHT - 40, y));

        player.style.transform = `translate(${x}px, ${y}px)`;

        // 미사일
        missiles.forEach((m, mi) => {
          m.y -= missileSpeed;
          m.x += (m.angle || 0) * missileSpeed;
          m.el.style.top = m.y + "px";
          m.el.style.left = m.x + "px";

          if (m.y < -20) {
            m.el.remove();
            missiles.splice(mi, 1);
          }
        });

        // 적
        enemies.forEach((e, ei) => {
          e.y += enemySpeed;
          e.el.style.top = e.y + "px";

          if (isColliding(e, { x, y }, 36, 36, 40, 40)) {
            e.el.remove();
            enemies.splice(ei, 1);
            createExplosion(e.x + 18, e.y + 18);
            hp--;
            hpEl.textContent = hp;
            if (hp <= 0) {
              alert("GAME OVER");
              location.reload();
            }
          }

          missiles.forEach((m, mi) => {
            if (isColliding(m, e, 4, 12, 36, 36)) {
              m.el.remove();
              e.el.remove();
              missiles.splice(mi, 1);
              enemies.splice(ei, 1);
              kills++;
              totalKills++;
              killsEl.textContent = kills;

              createExplosion(e.x + 18, e.y + 18);

              if (Math.random() < 0.3) {
                spawnPowerup(e.x, e.y);
              }

              if (kills === 5 + wave * 2) spawnBoss();
            }
          });
        });

        // 보스
        if (boss) {
          boss.x += bossDir * 2;
          if (boss.x <= 0 || boss.x >= GAME_WIDTH - 120) {
            bossDir *= -1;
          }

          boss.el.style.left = boss.x + "px";
          boss.el.style.top = boss.y + "px";

          missiles.forEach((m, mi) => {
            if (isColliding(m, boss, 4, 12, 120, 80)) {
              m.el.remove();
              missiles.splice(mi, 1);
              boss.hp--;
              createExplosion(m.x, m.y);
              boss.hpInner.style.width = (boss.hp / boss.maxHp) * 100 + "%";

              if (boss.hp <= 0) {
                createExplosion(boss.x + 60, boss.y + 40);
                createExplosion(boss.x + 40, boss.y + 30);
                createExplosion(boss.x + 80, boss.y + 50);
                setTimeout(() => {
                  nextWave();
                }, 800);
              }
            }
          });
        }

        // 파워업 처리
        powerups.forEach((p, pi) => {
          p.y += 2;
          p.el.style.top = p.y + "px";

          if (isColliding(p, { x, y }, 24, 24, 40, 40)) {
            p.el.remove();
            powerups.splice(pi, 1);
            activatePowerup(p.type);
          }

          if (p.y > GAME_HEIGHT) {
            p.el.remove();
            powerups.splice(pi, 1);
          }
        });

        // 파티클 업데이트
        particles.forEach((p, pi) => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          p.el.style.left = p.x + "px";
          p.el.style.top = p.y + "px";
          p.el.style.opacity = p.life / 30;

          if (p.life <= 0) {
            p.el.remove();
            particles.splice(pi, 1);
          }
        });

        // 파워업 타이머 감소
        if (activePowerup) {
          powerupTimer--;
          if (powerupTimer <= 0) {
            missileSpeed = 10;
            multiShot = false;
            activePowerup = null;
          }
        }

        requestAnimationFrame(gameLoop);
      }

      gameLoop();
    </script>
  </body>
</html>
