<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Shooting Game with Boss</title>
    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: Arial, sans-serif;
      }

      #container {
        position: relative;
      }

      #ui {
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        font-size: 16px;
      }

      #game {
        position: relative;
        width: 800px;
        height: 600px;
        background: linear-gradient(#0a0a2a, #000);
        overflow: hidden;
        border: 2px solid #444;
      }

      #player {
        position: absolute;
        width: 40px;
        height: 40px;
        background: skyblue;
        clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);
      }

      .missile {
        position: absolute;
        width: 4px;
        height: 12px;
        background: yellow;
      }

      .enemy {
        position: absolute;
        width: 36px;
        height: 36px;
        background: crimson;
        clip-path: polygon(50% 100%, 100% 0%, 50% 20%, 0% 0%);
      }

      .boss {
        position: absolute;
        width: 120px;
        height: 80px;
        background: purple;
        border: 3px solid white;
      }

      .boss-hp {
        position: absolute;
        top: -10px;
        left: 0;
        width: 100%;
        height: 6px;
        background: #333;
      }

      .boss-hp-inner {
        height: 100%;
        background: red;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="ui">
        <div>HP: <span id="hp">3</span></div>
        <div>Kills: <span id="kills">0</span></div>
      </div>
      <div id="game">
        <div id="player"></div>
      </div>
    </div>

    <script>
      const game = document.getElementById("game");
      const player = document.getElementById("player");
      const hpEl = document.getElementById("hp");
      const killsEl = document.getElementById("kills");

      const GAME_WIDTH = 800;
      const GAME_HEIGHT = 600;

      let x = GAME_WIDTH / 2 - 20;
      let y = GAME_HEIGHT - 60;

      let hp = 3;
      let kills = 0;

      const speed = 6;
      const missileSpeed = 10;
      const enemySpeed = 2;

      const missiles = [];
      const enemies = [];

      let boss = null;
      let bossDir = 1;

      const keys = {};

      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;
        if (e.key === " ") fireMissile();
      });

      document.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      function fireMissile() {
        const missile = document.createElement("div");
        missile.className = "missile";

        const mx = x + 18;
        const my = y;

        missile.style.left = mx + "px";
        missile.style.top = my + "px";

        game.appendChild(missile);
        missiles.push({ el: missile, x: mx, y: my });
      }

      function spawnEnemy() {
        if (boss || kills >= 10) return;

        const enemy = document.createElement("div");
        enemy.className = "enemy";

        const ex = Math.random() * (GAME_WIDTH - 36);
        const ey = -40;

        enemy.style.left = ex + "px";
        enemy.style.top = ey + "px";

        game.appendChild(enemy);
        enemies.push({ el: enemy, x: ex, y: ey });
      }

      setInterval(spawnEnemy, 1000);

      function spawnBoss() {
        const bossEl = document.createElement("div");
        bossEl.className = "boss";

        const hpBar = document.createElement("div");
        hpBar.className = "boss-hp";
        const hpInner = document.createElement("div");
        hpInner.className = "boss-hp-inner";
        hpBar.appendChild(hpInner);

        bossEl.appendChild(hpBar);
        game.appendChild(bossEl);

        boss = {
          el: bossEl,
          hpInner,
          x: GAME_WIDTH / 2 - 60,
          y: 40,
          hp: 20,
          maxHp: 20,
        };
      }

      function isColliding(a, b, aw, ah, bw, bh) {
        return (
          a.x < b.x + bw && a.x + aw > b.x && a.y < b.y + bh && a.y + ah > b.y
        );
      }

      function gameLoop() {
        // 플레이어 이동
        if (keys.ArrowUp) y -= speed;
        if (keys.ArrowDown) y += speed;
        if (keys.ArrowLeft) x -= speed;
        if (keys.ArrowRight) x += speed;

        x = Math.max(0, Math.min(GAME_WIDTH - 40, x));
        y = Math.max(0, Math.min(GAME_HEIGHT - 40, y));

        player.style.transform = `translate(${x}px, ${y}px)`;

        // 미사일
        missiles.forEach((m, mi) => {
          m.y -= missileSpeed;
          m.el.style.top = m.y + "px";

          if (m.y < -20) {
            m.el.remove();
            missiles.splice(mi, 1);
          }
        });

        // 적
        enemies.forEach((e, ei) => {
          e.y += enemySpeed;
          e.el.style.top = e.y + "px";

          if (isColliding(e, { x, y }, 36, 36, 40, 40)) {
            e.el.remove();
            enemies.splice(ei, 1);
            hp--;
            hpEl.textContent = hp;
            if (hp <= 0) {
              alert("GAME OVER");
              location.reload();
            }
          }

          missiles.forEach((m, mi) => {
            if (isColliding(m, e, 4, 12, 36, 36)) {
              m.el.remove();
              e.el.remove();
              missiles.splice(mi, 1);
              enemies.splice(ei, 1);
              kills++;
              killsEl.textContent = kills;

              if (kills === 10) spawnBoss();
            }
          });
        });

        // 보스
        if (boss) {
          boss.x += bossDir * 2;
          if (boss.x <= 0 || boss.x >= GAME_WIDTH - 120) {
            bossDir *= -1;
          }

          boss.el.style.left = boss.x + "px";
          boss.el.style.top = boss.y + "px";

          missiles.forEach((m, mi) => {
            if (isColliding(m, boss, 4, 12, 120, 80)) {
              m.el.remove();
              missiles.splice(mi, 1);
              boss.hp--;
              boss.hpInner.style.width = (boss.hp / boss.maxHp) * 100 + "%";

              if (boss.hp <= 0) {
                alert("YOU WIN!");
                location.reload();
              }
            }
          });
        }

        requestAnimationFrame(gameLoop);
      }

      gameLoop();
    </script>
  </body>
</html>
